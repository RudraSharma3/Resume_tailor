# Render Blueprint: Render -> New -> Blueprint -> pick this repo.
# You'll be asked for the values marked `sync: false` (they're secrets and never stored in git).
services:
  - type: web
    name: resume-tailor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn resume_tailor.server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # AI provider: fill ANTHROPIC_API_KEY (Claude, paid) or GEMINI_API_KEY + LLM_PROVIDER=gemini (free tier).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AI_DAILY_LIMIT
        value: "40"
